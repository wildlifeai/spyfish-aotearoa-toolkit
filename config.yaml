csv_mapping:
  drop_id_column: "DropID"
  pipeline_status_column: "PipelineStatus"
  survey_id_column: "SurveyID"
  site_id_column: "SiteID"
  replicate_column: "ReplicateWithinSite"
  file_name_column: "FileName"
  link_to_marine_reserve_column: "LinkToMarineReserve"
  protection_status_column: "ProtectionStatus"
  site_name_column: "SiteName"
  selection_reason_column: "SelectionReason"
  is_bad_deployment_column: "IsBadDeployment"
  video_file_link_column: "LinkToVideoFile"
  sampling_start_column: "SamplingStart"
  sampling_end_column: "SamplingEnd"
  # Region lives on Marine Reserves.csv (67 rows), NOT on the sites sheet — it is
  # reached by joining a site's LinkToMarineReserve to the reserve Title.
  region_column: "Region"
  reserve_title_column: "Title"                     # Marine Reserves.csv
  reserve_acronym_column: "SurveyLocationAcronym"   # the 3-letter DropID prefix
  # Coordinates appear on both sheets and mean different things. The site pair is
  # the PLANNED position and is named Targeted* upstream; the deployment pair is
  # where the drop actually landed. Ingesting both lets the two be compared — a
  # large gap means a mis-sited drop or a typo.
  # Treat all four as sensitive — see `sensitive_columns` below.
  latitude_column: "Latitude"                   # BUV Deployment.csv — actual
  longitude_column: "Longitude"                 # BUV Deployment.csv — actual
  targeted_latitude_column: "TargetedLatitude"   # BUV Survey Sites.csv — planned
  targeted_longitude_column: "TargetedLongitude" # BUV Survey Sites.csv — planned
  depth_column: "DepthDeployment"               # BUV Deployment.csv only
  # NZ Marine Habitat Classification Scheme fields, BUV Deployment.csv only.
  # Sparse (~12% / ~7% filled) and free-ish text; normalised at ingest via
  # `NZMHCS_ALIASES` in spyfish/orchestrator/ingest.py.
  nzmhcs_abiotic_column: "NZMHCS_Abiotic"
  nzmhcs_biotic_column: "NZMHCS_Biotic"
  # Selection CSV columns
  # All time columns are absolute seconds from frame 0 of the source video file.
  clip_start_absolute_column: "ClipStartAbsoluteSeconds"
  clip_end_absolute_column: "ClipEndAbsoluteSeconds"
  clip_max_time_column: "TimeOfMaxAbsoluteSeconds"
  maxn_time_seconds_column: "TimeOfMaxAbsoluteSeconds"
  confidence_agreement_column: "ConfidenceAgreement"
  confusion_score_column: "ConfusionScore"
  scientific_name_column: "ScientificName"
  common_name_column: "CommonName"  # BUV Species.csv — used to resolve common names in legacy annotation sheets
  maxn_time_column: "TimeOfMax"
  max_interval_column: "MaxInterval"
  annotated_by_column: "AnnotatedBy"
  interval_annotation_column: "IntervalAnnotation"
  source_column: "Source"  # annotations export only: which account a row belongs to: legacy / biigle_volume_N / model name (AnnotatedBy says only who)
  time_seconds_column: "TimeAbsoluteSeconds"
  subject_id_column: "SubjectID"  # Zooniverse subject_id — written into citsci MaxN CSVs and the annotations DB external_id for provenance
  # ML MaxN CSV only — persistence-filter provenance columns (absent from citsci/expert MaxN CSVs).
  model_name_column: "ModelName"                # which model produced the row; AnnotatedBy is just "ml", as in the DB
  raw_max_interval_column: "RawMaxInterval"     # single-frame max before the persistence filter; >= MaxInterval
  spike_flag_column: "SpikeFlag"                # true when the persistence filter reduced this interval's count
  spike_time_seconds_column: "SpikeTimeSeconds" # absolute seconds of the suppressed raw peak frame (empty unless SpikeFlag)

# SQLite column names that must never leave the pipeline unauthenticated. Stripped
# from DatabaseManager.export_to_csv() and from every dashboard download button.
#
# BUV sites are baited and deliberately placed where fish aggregate, so a list of
# coordinates joined to MaxN counts is in effect a ranked fishing map; for rare
# species it is a poaching aid. Deployment coordinates are the more sensitive pair
# because they are the exact drop positions rather than a nominal site label.
#
# These are DB column names (snake_case), not CSV headers — the strip runs against
# dataframes read out of SQLite.
sensitive_columns:
  - latitude
  - longitude

# ProtectionStatus arrives from SharePoint with case and whitespace variants that
# split one category across several chart bars. Keys are the lowercased, whitespace-
# collapsed form; values are the spelling to store. Whitespace alone is handled in
# code — only add an entry here when the CASE differs too.
protection_status_aliases:
  "no protection": "No protection"

# The canonical spellings. Every value that reaches the database is matched to
# this list ignoring case and whitespace, so "NO PROTECTION" and "No  protection"
# both store as "No protection" without needing an alias entry each. Validation
# flags anything that matches nothing here, which is the point: an unrecognised
# status silently becomes "Other" in every reserve comparison, and a new spelling
# is indistinguishable from a new category unless something says so.
#
# The `&known_protection_statuses` anchor is referenced by the sites validation
# rule below (`allowed: *known_protection_statuses`). One list, two uses: the
# spellings the pipeline stores and the values validation accepts are the same
# question, and two copies drift the moment one is edited alone.
known_protection_statuses: &known_protection_statuses
  - "Type I MPA (Marine Reserve)"
  - "Type II MPA"
  - "High Protection Area"
  - "Seafloor Protection Area"
  - "Fisheries Act closure areas"
  - "Taiapure"
  - "Mataitai"
  - "No protection"
  - "Other"

# Reporting / dashboard defaults.
reporting:
  # Classes that are NOT species: the detector's catch-all for an animal it could
  # not name, plus non-animal labels. They must be excluded from any abundance figure by default
  # — "fish" alone is ~70% of all recorded MaxN, so leaving it in makes every
  # site and reserve total a measure of detector activity rather than ecology.
  # The unknown/UnID variants come from legacy expert CSVs, which spell
  # "animal we could not identify" several ways.
  # The BIIGLE label names are here as well as the normalised `fish`: class_map
  # folds them into `fish` on the way in, but legacy expert rows imported before
  # that mapping existed still carry the raw label, and two of them are in the
  # annotations database today. Listing them costs nothing and stops an
  # unidentified animal being counted as a species called "Fish: final".
  # "NULL DEPLOYMENT" is spyfish.config.base.NULL_DEPLOYMENT: the row a source
  # writes to say it reviewed this deployment and saw nothing. It must never be
  # counted as a species, but it must stay in the frame, because it is what
  # makes a real zero distinguishable from "this source never looked".
  # "Sp1".."Sp7" are legacy workbook placeholders meaning "an unidentified
  # species, the Nth distinct one in THIS survey" (species_map_global.yaml
  # maps "Unidentified spp. 1" onto them). They are not species, and worse,
  # they are not even stable names: Sp1 in one survey and Sp1 in another are
  # different animals, so counting "Sp1" as one species programme-wide is
  # wrong in both directions. 21 deployments across 8 surveys carry them.
  non_species_classes: ["fish", "bait", "unknown", "Unknown", "UnID", "unid",
                        "Fish: final", "Fish - Final", "Fish: review required",
                        "To review", "NULL DEPLOYMENT",
                        "Sp1", "Sp2", "Sp3", "Sp4", "Sp5", "Sp6", "Sp7"]

  # What the report calls them once they are merged. One bucket, shown rather
  # than silently dropped: "we saw something and could not name it" is a real
  # observation, and hiding it makes the identified species look like the whole
  # catch. Charts that count SPECIES (richness, accumulation, co-occurrence)
  # still exclude it, because it is not one species.
  unidentified_label: "Unidentified"

  # First month of the survey season the dashboard reports by. 7 = July to
  # June: fieldwork runs December to May, so a calendar year cuts one season
  # across two years. A season is shown by both years (2026/27). 1 gives plain
  # calendar years back.
  survey_season_start_month: 7

  # The model's catch-all detection — an animal it could not identify. Named once
  # here because two places need it: excluded from abundance figures above, and
  # banded by box size in extraction.frame_strategy (it is not one species but N
  # unknown ones, so it earns several review frames rather than one).
  catchall_class: "fish"

  # Species used to characterise a reserve's population. These are the fished
  # species whose recovery inside reserves is the thing BUV surveys exist to
  # measure, so summing every species together (mixing a snapper with a spotty)
  # answers no useful question. Used as the map's default selection; the user can
  # override it per view.
  # What the Species search view opens on, first match in the data wins.
  # Something memorable rather than the commonest species, but nothing a
  # poacher would want a site list for (CLAUDE.md, "Sensitive data"): morays
  # and rays are not fished, and both are seen on dozens of deployments.
  # Falls back to `indicator_species`, then the first name in the list.
  species_search_default:
    - "Gymnothorax prasinus"      # yellow moray
    - "Myliobatis tenuicaudatus"  # eagle ray
    - "Bathytoshia brevicaudata"  # short-tailed stingray

  indicator_species:
    - "Chrysophrys auratus" # snapper — the classic NZ reserve-effect indicator (WoRMS name; Pagrus auratus is a synonym)
    - "Parapercis colias"   # blue cod — the southern equivalent
    - "Jasus edwardsii"     # rock lobster — heavily fished, strong reserve response

  # ProtectionStatus values that count as "protected" for inside/outside MPA
  # comparisons. Partial regimes (Mataitai, Taiapure, seafloor-only) are
  # deliberately NOT here — they restrict some fishing but not the take of
  # these indicator species, so counting them as protected would blunt the
  # very contrast the comparison exists to show.
  # Two statuses count as protected and exactly one as unprotected. Everything
  # else is a partial or unclear regime (Type II MPA, Taiapure, Mataitai,
  # Fisheries Act closures, Seafloor Protection, "Other"), and those restrict
  # *some* fishing without clearly protecting the species this report counts.
  # They form a  third group, "Other", which the inside-versus-outside
  # comparisons leave out and say so, rather than being folded into whichever
  # side happens to look right.
  protected_statuses:
    - "Type I MPA (Marine Reserve)"
    - "High Protection Area"

  unprotected_statuses:
    - "No protection"

# Centralized path and storage configuration
paths:
  # Base directory for all project data
  base_dir: "process_files"
  deployment_targets_csv: process_files/deployment_targets.csv
  # Workflow versions cached by the validation sync-back (one JSON per workflow).
  # Answers are indexes whose meaning depends on the version they were given under.
  zooniverse_workflow_versions: process_files/zooniverse/workflow_versions
  # Classifications pulled from Panoptes by the two Zooniverse syncs: one
  # JSON-lines file per workflow plus the last classification id seen, so each
  # run fetches only what volunteers did since the previous one.
  zooniverse_classifications: process_files/zooniverse/classifications
  # Scientific-name synonyms, `written name: canonical name`, applied to EVERY
  # row on its way into the annotations DB (AnnotationDatabaseManager.add_annotations
  # -> SpeciesRegistry.canonical_name). It is the same file the legacy workbook
  # extraction applies at conversion time, so one map serves both: workbook typos
  # (`Chelidonchthys kumu`), WoRMS synonyms (`Lotella rhacinus`), NZ-usage
  # corrections (`Pseudocaranx dentex` -> `georgianus`) and the placeholders that
  # mean "unidentified animal" (`Sp1`..`Sp7`, `Unidentified` -> `fish`). Chains
  # resolve to a fixed point and the canonical must be a registry name
  # (class_map.json). A name that is neither is kept as written and logged at
  # ERROR with its row count: nothing is dropped, the log says what to add.
  # Lives in the legacy help dir so it syncs with it.
  species_synonyms: process_files/legacy_data_help/species_map_global.yaml
  # Species-presence prior per marine reserve, built by scripts/build_site_prior.py
  # from EXPERT annotations (two_stage_classifier_plan.md §6). SENSITIVE: it says
  # which species occur in which reserve, so it stays under process_files/
  # (gitignored) and is never exported to a public tool.
  site_prior: process_files/site_prior
  # Legacy directories (at project root, synced to S3, gitignored)
  legacy:
    zooniverse: "process_files/zooniverse/legacy_classifications"
    # Hand-maintained knowledge files for the legacy workbook extraction
    # (fix_keys.yaml, species / survey maps, site matching) plus the cached
    # SharePoint lists under reference/. Under process_files/ so they travel
    # to S3 with the other pipeline data and stay out of git: reference/
    # and the site coordinates are sensitive (CLAUDE.md, "Sensitive data").
    annotations_help: "process_files/legacy_data_help"
    # `legacy DropID: SharePoint DropID` for legacy expert rows whose DropID
    # disagrees with the deployment SharePoint records (e.g. the workbook says
    # replicate _02 where SharePoint and the video say _01). Applied by
    # --legacy-experts right after the CSV is read. File name, in annotations_help.
    drop_id_map: "legacy_drop_id_map.yaml"
  movie_extensions: ["avi", "mov", "mp4", "mpg", "wmv"]
  missing_files_filename: "missing_files_in_aws.txt"
  extra_files_filename: "extra_files_in_aws.txt"
  # Metadata paths (relative to bucket root)
  metadata:
    root: "spyfish_metadata"
    sharepoint_dir: "sharepoint_lists"
    status_dir: "status"
    files:
      deployment_csv: "BUV Deployment.csv"
      survey_csv: "BUV Survey Metadata.csv"
      site_csv: "BUV Survey Sites.csv"
      species_csv: "BUV Species.csv"
      reserves_csv: "Marine Reserves.csv"
      legacy_experts_csv: "BUV Annotations Legacy Experts.csv"

  # Optional: absolute path to an alternate base dir for media downloads (e.g. /tmp/spyfish).
  # Use this for a temp/no-backup location when videos are large or ephemeral.
  # If unset, media resolves to <project_root>/media as before.
  media_base_dir: /nesi/nobackup/wildlife03546

  # Sub-directories (local and S3 suffixes)
  sub_dirs:
    media: "media"
    annotations: "annotations"
    deployment_data: "deployment_data"
    db: "db"
    logs: "logs"
    training: "training"
    models: "models"
    base_model: "base_model"
    pipeline_model: "pipeline_model"
    archived_models: "archived_models"
    classifier: "classifier"     # second-stage species classifier checkpoints (finetune_bioclip.py format), newest stamp wins
    bioclip: "bioclip"           # open_clip hub cache of the frozen BioCLIP 2 backbone, ~1.7 GB, downloaded once per machine
    two_stage: "wip_two_stage"   # second-stage classifier training outputs (crops, embeddings, reports, fine-tune runs). Historical name; renaming it means moving the folder on every machine
    exports: "exports"           # review exports (slates, MaxN frames, per-survey reports): data, so under process_files/


ml_inference:
  limit_processing: 5 # SAFEGUARD: Only process N videos per run while building
  log_interval_frames: 10 # Log every N frames during ML inference
  ml_fps: 3        # Target frames per second for ML inference. Stride is computed at runtime from the video's actual FPS.
                   # Do not lower without re-measuring maxn_persistence_seconds: the window is converted to frames from
                   # the raw CSV's spacing, and below ~2 fps a 1.0 s window rounds to ONE frame, i.e. the filter is off.
                   # Thinning the 3 fps raw CSVs (scripts/fps_thinning_experiment.py, 2026-11-03, 132 runs) showed the
                   # sampling itself costs little (1.5 fps reproduces the 3 fps MaxN in 80% of drop x species pairs,
                   # never higher) while the window change moves counts by ~0.7 either way. See design_doc.md.
  imgsz: model   # 'model' = the size in the checkpoint's train_args (the model is the source of truth, see spyfish/ml/model_meta.py);
                 # a number overrides it for experiments and logs a WARNING when it differs from what the model was trained at.
                 # Before 2026-11-10 this was a bare 640 with no link to the loaded weights, so a model trained at another size
                 # would have run at the wrong one with no error.
  confidence_threshold: 0.25      # Base YOLO inference threshold; gates raw detections → BIIGLE frame selection AND every box uploaded to BIIGLE (build_coco_from_raw_csv applies no further confidence filter, it just takes the raw row nearest the frame time). So a box visible in BIIGLE is a detection at or above THIS value, currently 0.25. NOTE 2026-08-24: this comment previously read "Lowered 0.25→0.15 (2026-05-26) to surface more boxes for expert review" while the value sat at 0.25 — either the change was reverted or never applied. Decide whether 0.15 was intended before trusting the recall-leaning rationale.
  maxn_confidence_threshold: 0.40  # 'model' = the cutoff picked for the checkpoint on its val split at the F-beta peak (training.threshold_beta), stored beside the weights as <model>.thresholds.json and read by spyfish/ml/model_meta.py; written by the evaluate step for every new model, or by `python -m spyfish.ml.training.threshold --model production` for an existing one. A number overrides it and WARNS when the sidecar disagrees. Switch to 'model' once production has a sidecar (NeSI, one val pass). Never below confidence_threshold: the raw CSV holds nothing under it. Hand-set history: Gates the MaxN CSV → Zooniverse/citsci clip selection AND the reported ML abundance count. Lowered 0.50→0.40 (2026-05-26) to surface more clips for volunteer review.
  # Persistence filter (2026-08-21): a count only sets MaxN if sustained across a rolling
  # window of sampled frames; single-frame spikes are recorded (RawMaxInterval/SpikeFlag
  # columns) but do not count. Measured across 19 drops: 40% of detection runs last exactly
  # 1 frame (detector misfires), while median peak confidence rises 0.49 → 0.79 with run
  # length. Both windows are seconds, converted to sampled frames at runtime from the raw
  # CSV's own frame spacing (~1/ml_fps). Set persistence to 0 to disable (single-frame MaxN).
  maxn_persistence_seconds: 1.0    # Rolling-min window: count must hold this long to count toward MaxN (3 frames at ml_fps 3).
  maxn_gap_fill_seconds: 0.4       # Zero-gaps up to this long between detections take min(neighbours) first ("threshold flicker" forgiveness — 49% of gaps between runs are 1 frame). Never invents detections: an isolated blip stays exposed.
  maxn_exclude_classes: ["bait", "Not a fish?"]   # Classes whose detections never count toward MaxN and never get a MaxN row. The bait fish strapped to the canister is a real fish visually; only the class split keeps it out of abundance counts.
  # Legacy review frames (2026-10-12). Deployments that carry legacy expert
  # annotations (per-30s-interval workbook counts, external_id='legacy') get
  # their expert MaxN moments pulled from the video after --ml, so the expert's
  # count and the model's boxes sit on the same frame. The clean frame goes to
  # frames/ once (model-independent, shared with the BIIGLE/Zooniverse uploads);
  # the box-drawn copy goes to qa_frames/legacy/<model>/ so a re-run with
  # another model lands beside the old one rather than over it.
  legacy_review:
    random_intervals: 3            # Besides each species' peak, this many other scored intervals per species (seeded by DropID, so the same ones come back). Checks the analyst's counting at ordinary moments, not just the peak.
    max_time_delta_seconds: 0.5    # The clean frame is the raw-CSV frame nearest the legacy second, so the drawn boxes match the pixels. Beyond this gap (no detection near that second) the frame is seeked by time instead and drawn with no boxes.
  max_boxes_per_frame: 80          # Sanity ceiling: if a drop's inference averages more detections/frame than this, treat it as degenerate (model saturating max_det on out-of-distribution footage, or confidence_threshold mis-set to ~0) and fail the drop instead of building a giant COCO. No real BUV frame has 80 fish; the flood case hits YOLO's max_det=300.
  video_reader: cv2                # How inference decodes video: cv2, or ffmpeg (`ffmpeg -map 0:v:0`, every other stream discarded). Raw GoPro chapters carry audio + tmcd + gpmd + fdsc streams; cv2 reads them all and on some chapters stalls past its 30 s read timeout (UoA on NeSI, 2026-11-11). Merged pipeline videos are clean, so cv2 stays the default; callers override per call (run_yolo_inference(reader=...)).
  min_frame_coverage: 0.9          # Share of the sampled frames a video must yield before its raw CSV is promoted. A failed cap.read()/grab() ends the decode loop exactly like the end of the video, so a read that stalls (UoA Vault files on NeSI, 2026-10-28 and 2026-11-11: 3 of 2,121 frames) used to promote a near-empty CSV as finished. Below this the CSV stays .partial and the drop fails.
  half: true                       # FP16 inference (model.predict(half=True)). Free speed on every NVIDIA GPU we use (l4/a100/h100 all have tensor cores); YOLO's boxes are unchanged to well within the confidence rounding. Ultralytics ignores it on CPU, so the same config runs on a laptop.
  batch_size: 32                   # Frames per YOLO predict() call during video inference AT batch_size_imgsz. Batching amortises per-call overhead and keeps the GPU fed (single-frame calls leave an A100 at ~0% util). 32 fits comfortably at imgsz=640 on a 40GB A100; lower for smaller GPUs.
  batch_size_imgsz: 640            # The image size batch_size was sized for. A model that runs larger gets batch_size x (this / imgsz)^2, floor 1, so memory per call stays about constant (1280 -> 8).
  # YOLO NMS, applied at inference (passed to model.predict). Cleans overlapping/stacked
  # boxes at the source, so the raw CSV — and therefore MaxN counts, frame selection AND
  # the BIIGLE COCO — are all consistent. Tuning these requires re-running --ml (fast now
  # that inference is batched).
  nms_iou: 0.45                    # Boxes overlapping more than this IoU are suppressed. Lower = more aggressive merging of duplicate boxes on one fish (YOLO default 0.7). Tuned to 0.45 by eyeballing real frames across SLI_117_02 (2026-06-04): 0.4 cleaned duplicates dramatically but deleted one real fish; 0.45 keeps the dedup win while preserving that fish. Raise toward 0.5 if distinct overlapping fish (schooling/eels) get merged.
  nms_agnostic: true               # Cross-class NMS: when true, an overlapping species box + generic 'fish' box on the same animal collapse to one (highest confidence wins) instead of both surviving. YOLO default is false (per-class).
  # Second stage (two_stage_classifier_plan.md): BioCLIP 2 names every YOLO box from its
  # full-resolution crop; YOLO keeps finding them. Frozen test drops, 2026-11-04, the same
  # 1,235 detected boxes: fine-tune 0.951 acc / 0.768 macro F1 vs the species head's
  # 0.930 / 0.599, better on every species but silver sweep (recall 0.66 vs 0.78).
  # The raw CSV's `class` becomes the classifier's name; `confidence` stays the DETECTION
  # score (every threshold downstream gates on it); yolo_class / yolo_confidence /
  # clf_class / clf_confidence keep both opinions. Runs in the GPU job (--ml-infer).
  classifier:
    enabled: true
    backbone: "hf-hub:imageomics/bioclip-2"   # open_clip name; cached under paths.sub_dirs.bioclip. Compute nodes have no internet: HF_HUB_OFFLINE=1 (scripts/slurm/_env.sh)
    crop_margin: 0.10         # share of the box added on each side before the crop, what the fine-tune trained on
    min_box_px: 16            # a box smaller than this on either side keeps the YOLO name: nothing to classify
    batch_size: 64            # crops per encode_image call
    preprocess_workers: 4     # threads that resize the crops of one batch (PIL releases the GIL in the resize), so the GPU is not waiting on a one-by-one loop. Same tensors in the same order as the serial path; 0 or 1 = serial. gpu.sl asks for 8 CPUs and the video decode thread wants its share, hence 4
    p_min: 0.5                # top probability below this → fallback_label: a fish, species unsure (the demo's P_MIN)
    fallback_label: fish      # used below p_min when YOLO is not confident either
    fallback_to_yolo: true    # below p_min, keep YOLO's species when its detection confidence clears the floor below
    fallback_yolo_min_confidence: 0.5
    label_map:                # classifier class → pipeline name, applied before the species registry canonicalises
      "other fish": fish
  remote_host: "mahuika"
  remote_user: "kalindi"
  extraction:
    interval_seconds: 10
    annotated_by_prefix: "ml"

extraction:
  clip_length: 10.0        # Length of each extracted clip in seconds
  clip_cap: 180            # Maximum number of clips to extract per video
  video_start_threshold_seconds: 120 # Health-check window, measured FROM sampling_start (not from frame 0). Measuring from frame 0 silently produced no start frame at all on the 390 of 1820 deployments whose sampling_start is already past 120s.
  force_binary_strategy: false       # If true, use binary strategy regardless of species count
  sample_all_clips: false            # If true, bypass ML strategy and select every non-overlapping clip in the sampling window (subject to clip_cap)
  # Frame floor per deployment, shared across every bucket below. Set by expert
  # capacity, not by anything about the model — so the design question is never
  # "how many" but "which ones".
  #
  # A FLOOR on the total, never a ceiling. One peak frame per species is
  # mandatory (without it that species has no MaxN at all), so a species-rich
  # drop runs over and should. Discretionary buckets fill whatever the peaks
  # leave; where they can't — a single-class drop, or one whose boxes are all
  # the same size — blind frames take up the slack, so the floor always holds.
  #
  # No need to raise this while the model is young: a weak model emits mostly
  # the `fish` catch-all, which widens the unidentified bucket and lifts those
  # drops on its own. The extra frames land where the uncertainty is rather than
  # on every deployment alike.
  min_frames_per_drop: 10
  # FRAME selection buckets. Clips keep binary_strategy/multiclass_strategy below;
  # frames use this single per-species set, because one class is just the N=1 case
  # and the old binary/multiclass fork was pure complication.
  #
  # Allocation is by marginal information — what an expert label tells us that we
  # don't already know. See claude_docs/todo.md "Frame selection: one budget,
  # several buckets" for the measurements behind these numbers.
  frame_strategy:
    per_species_maxn: 2        # Mandatory for counting: no peak frame for a species = no MaxN for it at all
    per_species_confusing: 1   # High count, low confidence — resolves detection uncertainty
    fish_bands: 3      # Frames spanning the catch-all's box-size range. Measured diagonal spread was 4.1x for `fish` vs 1.8-2.7x for named species — it holds several different animals, so band by size rather than take the N largest counts. Self-limiting: a drop whose boxes are all one size yields one frame.
    random_detection_export: 3 # Random moments that HAVE at least one box, any species/confidence: the fair sample of ordinary detections for precision. Every other detection bucket is biased on purpose (peaks, low confidence, size extremes). Blind is the recall twin and may land on nothing.
    blind_export: 3            # ALWAYS taken, never mere filler: every other bucket is chosen by the model, so these are the only frames that can reveal a fish it never detected. A dense drop is precisely where that check matters, so this must not be squeezed out by a full budget.
    start_export: 1            # Health check on the opening of the deployment
    # ONE knob for review effort. Quotas are multiplied by it and spacing is
    # DIVIDED by it, because the two are not independent: on a real deployment
    # spacing is what binds, not the quotas. Tripling quotas alone yielded 21
    # frames instead of the ~57 the arithmetic suggests, because an 886-second
    # detection span has nowhere to put 24 frames 30s apart. So asking for 3x the
    # review means accepting 10s spacing, which the autocorrelation says still
    # samples the same moment twice (0.15 at 10s, 0.00 by 60s). That redundancy
    # is the real price of more frames — not the quota numbers.
    # One knob for review effort: multiplies the per-species and diversity quotas
    # below. 1 = as written. Restores what `frame_multiplier` did until it was
    # deleted in 2026-05 (see claude_docs/todo.md), minus the spacing half —
    # measurement showed quotas, not spacing, are what bind the frame count.
    #
    # Does NOT scale `start_export`: a deployment health check is one look at the
    # opening, however much review the rest of the drop gets.
    #
    # Measured on six real species-model drops: x1 = 22-37 frames (3/species),
    # x2 = 42-66 (6/species), x3 = 58-95. Species count drives the total, so a
    # 12-class drop costs three times a 6-class one at the same setting.
    effort_multiplier: 1
    spacing_divisor: 2       # Divides temporal_spacing_seconds ONLY; quotas are untouched. Raising it does not request more frames, it lets quotas that spacing was blocking actually fill — the count rises toward what the quotas already asked for, not past it.
    peak_merge_seconds: 5.0  # Window in which two species' peaks may SHARE one frame. Wider than same_frame_seconds because merging is count-checked: a merge only happens when the surviving frame actually shows the other species at its full peak count, so a generous window cannot silently undercount. Six species peaking within 26s is one aggregation event, not six.
    same_frame_seconds: 1.0    # ACROSS classes (within-class uses temporal_spacing_seconds below). Two picks closer than this are one moment: the second is a duplicate, AND a frame picked for one species is credited as showing whatever else was on screen. At ml_fps=3 the sampled frames are 0.33s apart, so this spans ~3 of them. Raise it and genuinely distinct moments start being treated as one; lower it and near-simultaneous detections each cost a frame.
    temporal_spacing_seconds: 30 # Raised from 10 once collapse_peaks became count-checked. Detection-count autocorrelation measured 0.15 at 10s and 0.00 by 60s, so 10s frames still sample the same moment twice.
  binary_strategy:
    maxn_export: 30          # Clips at highest fish-count moments
    confusing_export: 60     # Clips with high count but low confidence (uncertain detections)
    empty_export: 10         # Clips with zero detections (false negative check)
    start_export: 1          # Clips from the start of the video (health check)
    temporal_spacing_seconds: 10  # Minimum seconds between selected clips
  multiclass_strategy:
    per_species_maxn_export: 4       # MaxN clips per species
    per_species_confusing_export: 3 # Confusing clips per species
    per_video_empty_export: 3        # Empty clips per video
    per_video_start_export: 2        # Start clips per video
    temporal_spacing_seconds: 10     # Minimum seconds between selected clips
  ml_peak_augmentation:              # Adds frame-level ML peaks to citsci-driven BIIGLE selection (sub-second precision; catches moments volunteers missed)
    top_k_per_species: 2             # Extra frames added per species from the ML raw CSV (top-count peaks)
    min_confidence: 0.25             # Count detections at or above this conf — lower than maxn_conf=0.5 on purpose, surfaces transient multi-fish moments
    citsci_dedupe_tolerance_seconds: 1.0 # Drop ML-peak rows within this many seconds of any citsci-selected frame (avoids near-duplicates)

  # MaxN frames for the dashboard's Survey review, cut by
  # scripts/wip/export_maxn_frames.py into each deployment's review/ folder and
  # synced to S3 with it. 1200 px is the width the page and its HTML export
  # show them at; a full 1920 px frame is about 1 MB, this is about 150 KB.
  review_frames:
    width: 1200
    jpeg_quality: 80

  # Metadata slate: the handwritten whiteboard (site, date, time, lat/lon, depth)
  # rangers hold up to the camera before the drop. Scanned once per deployment at
  # the start of --ml, when the video is on local disk; the best frame is saved as
  # {drop}_slate.jpg in the drop folder for cross-checking SharePoint metadata.
  # A slate is the largest bright, unsaturated blob that is big, convex and
  # board-shaped, smooth inside (whiteboard, not non-slip deck) and carries a
  # handful of small dark strokes (handwriting). Thresholds were tuned on ONE
  # video (KSF_20240124_BUV_KSF_085_06, slate at 0-3 s): revisit once a batch of
  # slates has been collected.
  slate_detection:
    scan_width: 480            # analysis resolution, not the saved frame's
    save_width: 1280           # {drop}_slate.jpg is saved this wide (handwriting stays readable; 1920 was ~270 KB a slate). Slates saved before 2026-11-12 are full-res and are not re-made
    step_seconds: 1.0
    max_seconds: 120           # ceiling when sampling_start is missing or 0; the pipeline otherwise stops at sampling_start
    grace_seconds: 3.0         # keep looking this long after the last hit for a better frame
    paper_value_min: 120       # HSV value: bright; 120 not 150 because a board held close is in the holder's shadow (OKA, ORA close-ups measured 101-130), deck is ~93
    paper_saturation_max: 80   # HSV saturation: not coloured (white/grey). 80 not 50: shade under open sky is blue-tinted, a shaded board reads sat 41-76 (KOK_20240219 measured) and at 50 the mask kept only its lit half; KOK_054's datasheet, wholly in shade, came back paper=0.03
    # Underwater and open-water frames are blue nearly everywhere, and at
    # paper_saturation_max 80 pale seabed and sunlit water pass the paper mask
    # (KSF_085_02: seabed scored 8.7). A frame with more than water_frame_max
    # of its pixels in the water hue band is skipped outright: seabed 0.96-1.00,
    # deck with a board 0.22-0.26, deck with the sea behind 0.54 (measured 2026-11-04).
    water_hue_range: [80, 125]  # OpenCV hue: teal to blue
    water_saturation_min: 90   # 90 not 40: shaded white paper is blue-tinted (sat 45-85), seabed water 107-183 (measured 2026-11-06); at 40 a board filling the frame was skipped as sea (TON_001, TON_013 at 0 s)
    water_frame_max: 0.8
    # Second board colour: AHE writes on a varnished wooden clipboard, which the
    # white mask never sees. OpenCV HSV, measured on AHE_20250513 footage:
    # hue 12-15, saturation 90-180, value 160-220; the deck is value ~90 and
    # saturation ~50, the whiteboard saturation < 50, so the three do not overlap.
    # Which surveys use the wooden board. Everyone else writes on a whiteboard,
    # and with the wood mask on everywhere it picked hands and lit deck on
    # TUH, TON, KOK and BNP (61 rejects in the 2026-11-04 pass). A survey's
    # board is the same for all its drops, so this is per survey, not per drop.
    wood_surveys:
      - AHE_20250513_BUV
    wood_hue_range: [5, 25]    # orange/tan
    wood_saturation_min: 60    # coloured, unlike grey deck and white board
    wood_value_min: 120        # the lit face of the board, not shadow or deck
    # Ink is RELATIVE to the board: black marker is darker than the board by
    # ink_darker_by (HSV value); on a white board coloured marker (SLI 2022 is
    # green, OKA blue) is the saturated stuff instead, so either counts there.
    # Wood is itself saturated, so only darkness counts on it. The old absolute
    # ink_value_max: 90 missed every green/blue board (2026-11-04 review).
    ink_darker_by: 80          # sweep on 10 examples 2026-11-04: 80 lifts real boards most; hull dirt is as dark as marker at any value, that one is for the OCR gate
    ink_saturation_min: 110    # above the saturation of shaded white paper (p90 76), below green/blue marker
    min_paper_frac: 0.10       # largest white blob must cover >= this share of the frame
    min_rect_fill: 0.55        # blob area / its minimum bounding rectangle: boards 0.62-0.87, hands (the wood mask's twin) 0.51, deck patches 0.47
    min_solidity: 0.65         # blob area / convex hull area: a held-up board is convex, but gripping hands notch it (SLI_20260114_BUV_SLI_065_01: full board at 0.67-0.70; deck frames that pass aspect sit below 0.65)
    max_aspect: 2.2            # long/short side of the blob: boards 1.1-1.7, a clipboard with the datasheet strip 2.02 (NOI), deck strips 3-6
    max_edge_frac: 0.15        # Canny edge share inside the blob: whiteboard smooth, deck textured
    min_strokes: 5             # small dark components inside the blob (handwriting); blank board = 0
    sharpness_tie_band: 0.2    # candidates within this fraction of the top score are re-ranked by sharpness (Laplacian variance on the board): the crispest frame of the held-steady stretch, for reading
    review_candidates: 3       # frames the pipeline keeps per drop in {drop}_slate_candidates/, so the review page can offer runner-ups
    review_spread_frames: 2
    review_distinct_seconds: 5 # runner-ups at least this far apart, and a review scan runs the whole window: early false hits hid boards at 44 s and 64 s (SLI_065, SLI_066)    # plus this many frames spread over the above-water part of the scan: a choice when every scored frame is wrong
    stroke_area_frac: [0.0001, 0.03]  # ink component area as a FRACTION of the board blob: a letter on a close-up board is big, on a far one small; the old fixed [4, 400] px threw out the big letters and ranked close-ups last
    cut_off_penalty: 0.5       # score x (1 - this x sides/4) for a blob touching the frame edge: a half-visible board ranks below the whole board a second later
    max_cut_sides: 2           # a blob touching more frame edges than this is a flood, not a board: deck + chilly-bin lid 3, sky + sun glare 3-4, seabed 4; boards 0-2 (a datasheet cut at top and right is 2). Below that the penalty ranks.

zooniverse:
  project_id: 14054          # Upload target — single project only. spyfish-aotearoa main.
  source_project_ids:        # All projects to fetch classifications FROM
    - 14054                  # spyfish-aotearoa main
    - 30327                  # spyfish-aotearoa-ey (EY clone workflow)
  size_limit_mb: 12.0  # Zooniverse upload limit — CRF is calibrated to stay under this
  min_clips_per_video: 30  # Minimum clips per video — if ML strategy selects fewer, top up with evenly-spaced health checks
  min_agreement_pct: 50.0 # Aggregator filter: drop (subject, species) rows where vote_count / total_classifiers < this. Handles the full retirement-1 (expert) → retirement-30 (broad public) range without per-workflow tuning.
  consensus_something_here_pct: 50.0 # Consensus-fish rule: when no single species clears min_agreement_pct but at least this % of voters saw SOMETHING (votes - nothing_here_votes), emit one row with species="fish".
  # Validation uploads (--zooniverse-frames / --zooniverse-crops): volunteers
  # check the ML output directly. Frames are picked by the SAME selector and
  # quotas as BIIGLE expert review (extraction.frame_strategy); every ML box in
  # a picked frame then becomes a crop. Sets are uploaded as vframes_{drop} and
  # crops_{drop} and attached to their workflows by hand, like clips.
  validation:
    # Replaces frame_strategy.effort_multiplier for validation only; every quota
    # still comes from frame_strategy. Measured x1 = 22-37 frames per drop,
    # x2 = 42-66, x3 = 58-95. At ~4.7 boxes per frame, x3 is ~270-450 crops,
    # ~2-4 volunteer-hours per drop at 5 votes x 6 s. The knob to turn down.
    effort_multiplier: 3
    crops:
      min_bbox_px: 60          # Smaller boxes are too blurry once enlarged; still judged on the frame.
      crop_scale: 1.5          # Crop is 1.5x the box, so the animal fills ~45% of it (pilot: 2.0 left a 73px box at 25%).
      max_frame_fraction: 0.9  # Crop window never wider than 90% of the frame's short side.
      crop_image_px: 800       # Saved crop is 800x800 px: sharp on a phone, ~100 KB.
    frames:
      max_width_px: 1920       # Frames are saved at native width up to this; drawn boxes map back via the recorded scale.
    # Sync-back (--zooniverse-validation-sync): reads the retired sets' answers
    # back into per-drop verdict CSVs and advances *_uploaded → *_complete.
    sync:
      miss_iou: 0.3            # A drawn box overlapping an ML box at >= this IoU is a redraw, not a new fish. Loose on purpose: phone-drawn boxes are sloppy.
      # How the single-choice answers are spelled across workflow versions. An
      # answer is resolved to its label under the version it was given, then
      # read as yes or no through these lists; a label in neither raises, so a
      # reworded answer cannot silently count as "no vote".
      yes_labels: ["Yes"]
      no_labels: ["No"]

deployment_validation:
  buv_video_duration_seconds: 1800  # Expected minimum duration of a full BUV deployment (30 min)
  sampling_end_buffer_seconds: 0  # silent slack below the full duration: a video this much short is not even noted
  # A sampling WINDOW (end - start) short of the full duration by no more than this is an ISSUE:
  # recorded in validation_errors as `ingest_issue`, shown in reports, but the
  # deployment is still ingested ok and analysed. Shorter, or a window missing
  # altogether, is an ERROR and blocks the deployment (ingest_status
  # validation_error). A window LONGER than the full duration is normal and not
  # checked: the pipeline analyses sampling_start..sampling_end whatever its length. Measured 2026-11-05 on 451
  # window errors: 226 missing, 214 too long (median 108 s over), 11 short
  # (5 s to the whole video); SLI_20220228_BUV_SLI_093_01 was blocked for 8 s.
  sampling_window_issue_seconds: 60

orchestrator:
  log_output: "console"  # console: INFO -> stdout, WARNING+ -> stderr (SLURM .out / .err). file: dated file under paths.logs_dir, nothing on screen.

ffmpeg:
  crf: 22
  preset: "fast" # TODO is this ok
  codec: "libx264"


biigle:
  # Named projects. Workflow: pipeline uploads to `in_progress`; annotator moves
  # the volume to `done` when finished, which is where --biigle-sync reads from.
  # `playground` is the testing sandbox — point uploads there by setting
  # BIIGLE_PROJECT_ID=4081 in the environment.
  projects:
    in_progress: 4942        # upload target — pipeline pushes new volumes here
    done: 3711               # Spyfish Aotearoa — annotator-finished volumes
    playground: 4081         # sandbox for testing / try-things-out
    training: 4626           # legacy backup-of-record for training-data uploads
  # Default project for generic handler methods (used when no role is specified).
  # Points at in_progress so plain `config.biigle_project_id` = upload target.
  project_id: 4942
  disk_id: 134          #  134 doc, 98 test, S3 bucket disk reference
  annotation_report_type_video: 8          # Video annotation CSV report
  annotation_report_type_images: 3         # Image annotation CSV report
  # Done labels — whole-file labels that signal a volume is ready for ingestion.
  # All listed labels must be present. Gated on "Done Volume" only for now;
  # re-add "Done QA Review" once the QA pass is part of the workflow (see todo).
  done_labels: ["Done Volume"]
  # When true, --biigle-sync requires the Done-label gate (volume_is_done) before
  # ingesting a volume's annotations. When false, the volume's presence in the
  # `done` project (3711) is treated as sufficient and every volume awaiting sync
  # is ingested. Flipped to false 2026-05-28 — project moves are the workflow;
  # see todo to retire the label gate entirely.
  require_done_label: false
  # Genus-level expert IDs ("Conger sp", "Arripis spp.") are real observations,
  # not workflow labels: accepted at sync even when the species registry does
  # not know them, because new genus-level IDs appear whenever footage does not
  # support a species-level call, and registry-only acceptance silently dropped
  # them. Matches "Genus sp" / "Genus spp" with an optional trailing dot; the
  # dot is normalised away at ingest so one spelling reaches the DB.
  genus_level_label_pattern: "^[A-Z][a-z]+ spp?\\.?$"
  # Default fish label for ML annotations uploaded to Biigle
  # This is the exact fallback if a species is not found in label_mapping below.
  default_fish_label_id: 531298   # tree 3375 → "Fish: review required" — fallback for fish-bucket / unknown ML predictions
  default_bait_label_id: 537309   # tree 3375 → "Bait" — used when an ML annotation's class resolves to 'bait'
  default_label_tree_id: 3511 # 3375
  # Volume name for survey-pooled expert-review uploads (--survey-volume).
  # The " ML" suffix keeps these from colliding with bare-named training survey
  # volumes and per-drop expert volumes ("{drop_id}"). db_refresh matches
  # existing volumes back to surveys by this EXACT rendered name, so changing
  # it orphans pooled volumes created under the old name.
  expert_survey_volume_name_template: "{survey_id} ML"
  # Sibling templates: per-drop expert volumes and training survey volumes are
  # named by the bare ID — the project says training vs review, the ID says
  # survey vs drop, so a suffix only ate characters in a UI that truncates.
  # Same matching contract as above: db_refresh recognises existing volumes by
  # these rendered names, so a change orphans volumes created under the old ones.
  expert_drop_volume_name_template: "{drop_id}"
  training_survey_volume_name_template: "{survey_id}"

  # Fish-size measurement (biigle_parser.get_fish_sizes): a physical scale bar
  # of known length is annotated in-frame with this label; every other
  # annotation's pixel size is converted to cm against it. The label name is an
  # external contract with the BIIGLE label tree; the length is the field
  # protocol's actual bar.
  scale_bar_label_name: "Scale bar"
  scale_bar_length_cm: 10

  # Per-axis AABB shrink fraction for rotated-Rectangle → YOLO box conversion
  # (biigle_to_yolo). For a rotated rectangle, the closest non-corner feature to
  # each AABB edge is one of the 4 edge midpoints (head, tail, back, belly of
  # the fish silhouette). Shrinking each AABB axis by this fraction of that
  # midpoint's margin recovers background pixels without clipping anatomy.
  # 0 disables; 0.5 (half the geometric safety margin) leaves the rest as
  # buffer against annotator slop and float noise.
  rect_shrink_safety: 0.5

  # Label tree that holds the CMECS substrate / cover labels ("Spyfish CMECS
  # Substrate"). Any annotation whose label belongs to this tree is measured for
  # percent-cover, regardless of shape (magic-wand Polygon or traced LineString).
  # Tree membership — not a label-name prefix — is the discriminator: CMECS
  # hierarchy paths start at generic roots ("Biotic Component", "Substrate
  # Component", ...) with no Spyfish marker, so only the tree ID identifies them
  # reliably. This is also what separates a substrate LineString from a fish-SIZE
  # LineString: size lines carry a species label (tree 3511) or "Scale bar", so
  # they route to process_sizes() instead.
  substrate_label_tree_id: 3994

  # Label tree that holds the annotator's WORKFLOW labels rather than sightings
  # ("Done Volume", "In progress", "Nothing here", "Scale bar"). Its labels must
  # never reach the annotations database as scientific names.
  workflow_label_tree_id: 3375

  # The exceptions: workflow-tree labels that DO mark a real animal, and the
  # class each becomes. Everything else in that tree is progress tracking and
  # is dropped.
  #
  # "Fish: hold" and "To review" are deliberately absent: the first is
  # explicitly a temporary state awaiting relabelling, the second is a workflow
  # state rather than a sighting.
  workflow_tree_keep_labels:
    531299: "fish"   # Fish: final — annotated and identified as far as it goes
    531298: "fish"   # Fish: review required — a fish whose ID is unsettled
    # The dead fish tied on above the bait canister. Never an abundance figure
    # ("bait" is in reporting.non_species_classes), but wanted in the database
    # because it is a labelled fish and therefore useful training data.
    537309: "bait"

  # Whole-IMAGE labels that tell the expert why each frame was picked for review.
  # Attached per frame after upload; they are image labels, not annotation
  # labels, so they show on the volume-overview thumbnail, in the annotation
  # tool's "Image Labels" tab, and in the volume filter, and they never reach
  # the annotation CSV report that biigle_parser reads.
  #
  # They live in the WORKFLOW tree (3375) as children of a "Pick" parent, so
  # `workflow_tree_keep_labels` above already excludes them from ever becoming a
  # scientific name — the sync drops workflow-tree labels it was not told to
  # keep. Do not move them to the species tree (3511): experts pick from it.
  #
  # Keys are the canonical buckets in spyfish/biigle/selection_reason.py; only
  # IDs are stored here, so renaming a label in Biigle's UI needs no code
  # change. A `null` means "not created in Biigle yet" and those frames are
  # skipped, which is how the feature rolls out one bucket at a time. Set the
  # IDs from BiigleHandler.create_label (tree 3375, parent Pick 691591).
  # When true, a MaxN / Uncertain frame also gets the whole-image label of the
  # species it is evidence for, alongside its "Pick" reason label. Routed
  # through the same resolver as the bounding boxes, so the image label and the
  # box labels always name the species identically. Note this is the species
  # the frame was PICKED for, not an inventory of the frame: a blue cod peak
  # frame may also show a spotty, which the boxes label and this does not.
  selection_reason_include_species: true

  selection_reason_labels:
    maxn_peak: 691592      # Pick > MaxN peak      — the frame that decided a species' MaxN
    uncertain_id: 691594   # Pick > Uncertain ID   — high count, low confidence
    ml_peak: 691593        # Pick > ML peak        — top-K per-species raw detection peak
    fish_variety: 691595   # Pick > Fish variety   — spans the catch-all's box-size range
    spot_check: 691596     # Pick > Spot check     — model-blind even sample, catches misses
    video_start: 691597    # Pick > Video start    — deployment opening health check
    manual_count: 789381   # Pick > Manual count   — UoA: inside an interval the observers' hand count recorded a fish

  # OVERRIDE map only: species scientific/common name (from COCO JSON) → Biigle label ID.
  # This is the FIRST routing source in upload_frames.py and exists to force a model
  # class to a DIFFERENT label than its natural one — e.g. send an uncertain species to
  # "Fish: review required" for expert confirmation. It is NOT the species list.
  # Normal routing is handled downstream without any entry here:
  #   1. label_mapping (this dict)          ← overrides only
  #   2. species_labels.csv (~175 species)  ← full BIIGLE label tree, keyed by scientific name
  #   3. 'bait'  → default_bait_label_id
  #   4. 'fish' / unknown → default_fish_label_id
  # Most of the 16-class model (13 species + bait + fish) resolves via sources 2–4
  # with no entry here. Empty is the healthy state: every model class should
  # reach its label through species_labels.csv.
  # 2026-08-22: emptied. The `'Triglidae': 477395` override (routing the family
  # class to the red-gurnard species label, added 2026-06-03 because the family
  # label had been deleted from tree 3511) is gone: "Gurnards - Triglidae" is
  # back in the tree as 691421, so `Triglidae` resolves naturally again and a
  # family-level call is no longer indistinguishable from a species-level one.
  # The tree also gained "Rays - Batoidea" (691434) and "Sharks - Elasmobranchii"
  # (691433), so those two model classes route naturally too and need no entry.
  label_mapping:
    "Not a fish?": 789444   # static boxes flagged in --ml-post (spyfish/ml/static_boxes.py); workflow tree 3375, so a box the expert leaves is never synced back as a species
  # HTTP timeout for all Biigle API requests (seconds). Prevents indefinite hangs
  # on slow or unreachable endpoints.
  request_timeout_secs: 30
  # Rate limiting. The account was locked on 2026-10-16 after a loop kept
  # sending through 429s, so every request now goes through one rule: a 429 is
  # waited out for as long as its Retry-After header says and re-sent, at most
  # `rate_limit_max_retries` times, then the run raises and sends nothing more
  # to BIIGLE. No other status is retried. A Retry-After longer than
  # `rate_limit_max_wait_secs` raises at once rather than sleeping through it;
  # `rate_limit_fallback_wait_secs` is the wait when the header is missing.
  rate_limit_max_retries: 2
  rate_limit_fallback_wait_secs: 60
  rate_limit_max_wait_secs: 300
  # Threads posting whole-image "Pick" labels. BIIGLE has no bulk endpoint for
  # these, so it is one POST per label, some tens per drop. Was 20 (a whole
  # drop's labels in one burst); 4 costs a few seconds per drop. 1 is serial.
  image_label_workers: 4
  # Polling config for async Biigle operations
  volume_finalize_max_retries: 10
  volume_finalize_retry_interval_secs: 3.0
  report_download_max_retries: 60
  report_download_retry_interval_secs: 2.0

training:
  image_extensions: [".jpg", ".jpeg", ".png", ".bmp", ".tiff", ".tif", ".webp"]   # canonical image suffixes accepted anywhere in the pipeline
  epochs: 100
  patience: 25
  imgsz: 640
  batch: 16                     # 16 fits imgsz=640 on a100/40GB+; an L4 (22.5GB) OOMs at 16 and silently falls back to 8 (slower AND worse), so request a100 rather than raising this
  optimizer: "AdamW"           # AdamW outperformed SGD on the 2026-04 species sweep; flip back to "SGD" if needed
  lr0: 0.001                   # initial learning rate; scale up to ~0.01 if optimizer is SGD
  dropout: 0.1                 # classification-head dropout. Ultralytics applies it to classify models only; detect training (the species model, the detectors) ignores it
  # Every trainer passes these two blocks to YOLO verbatim (key = Ultralytics
  # argument name): the species retrain (train.py), the WIP detector job
  # (scripts/slurm/train_detector.sl) and anything that comes next.
  # They lived as two dicts inside train.py until 2026-11-10; the detector job,
  # written from config.yaml alone, never saw them and trained on Ultralytics
  # defaults with AMP on, which made its first result incomparable with the
  # species model. One place now, read through config.training_augmentation /
  # config.training_stability.
  augmentation:                  # underwater augmentation, validated in the yolov12_comparison experiments
    hsv_h: 0.05                  # hue: blue/green water shifts
    hsv_s: 0.8                   # saturation: murky vs clear water
    hsv_v: 0.6                   # value: lighting changes with depth
    degrees: 10.0                # slight rotation
    fliplr: 0.5                  # horizontal flips
    mosaic: 1.0                  # combine 4 images
    mixup: 0.1                   # slight mixup for overlapping fish
    bgr: 0.1                     # 10% chance to swap BGR channels
  stability:                     # keeps training from NaN-ing and from OOM under SLURM
    warmup_epochs: 5.0
    warmup_bias_lr: 0.0001
    nbs: 64
    amp: false                   # fp16 training produced NaN losses on some underwater datasets
    box: 5.0                     # bounding-box loss weight (Ultralytics default 7.5)
    cache: disk                  # decoded images cached to DISK. cache=true (RAM) OOM-kills under SLURM: Ultralytics sizes the RAM cache from psutil, which sees the whole node's memory, not the job's --mem (2026-06-03, killed at 32G)
    workers: 8                   # dataloader processes for epoch 1's disk reads
  train_pct: 1.0
  val_pct: 0.0                  # 0 = no per-survey val donation (used only when auto_balance_val is false). With auto_balance_val on, val comes from the species-balanced selector instead.
  # Species-balanced val selection (the suggester, folded into the pipeline).
  # When true, the split picks whole drops into val so each multi-source species
  # reaches ~val_balance_pct of its boxes (greedy, stops within tolerance), honouring
  # force_val_drops (seeded) / force_train_drops (excluded). Replaces per-survey donation.
  auto_balance_val: true
  val_balance_pct: 0.08         # target val fraction per multi-source species
  val_balance_tolerance: 0.2    # stop when the worst-covered species is within this of target (lower = more drops, tighter coverage)
  val_balance_overshoot_weight: 0     # penalty per box a candidate val drop carries beyond any species' deficit (steers the greedy toward the smallest covering drop). 0 = off. Tested 2026-08-20 on the local 34-drop dataset: every weight 0.05-2.0 INCREASED total val leakage (46%->52-55%) — with heavily drop-concentrated species, big drops satisfy many deficits per pick, so whale-grabbing is near-optimal and small-drop preference just adds picks. Re-evaluate on a richer drop pool via scripts/wip/compare_val_overshoot.py before enabling.
  val_balance_max_share: 0.4          # HARD cap: a candidate val drop is refused if adding it would push any multi-source species past this share of its boxes in val. Drop-concentrated species then stay train-heavy (small or zero val, logged) instead of landing 77-97% in val — a species you can't validate can still train; the reverse is useless. Local sweep 2026-08-21: 0.6→0 zero-val species/24% leakage, 0.4→2-3 zero-val/19%, 0.3→14% but eats val for real classes. 1.0 disables; check the balancer's under-covered log line each data prep.
  # Absolute floor on each species' val allocation, applied on top of
  # val_balance_pct. A pure percentage is scale-invariant and therefore wrong at
  # both ends: 8% of blue cod's 22112 boxes is 1769, a fine sample, while 8% of
  # Batoidea's 71 is 6. Measured 2026-08-23: Batoidea got 5 val boxes, Conger
  # verreauxi 4, Squalus 15 — the balancer hit its target exactly and the target
  # was useless, so every per-class metric for a rare species was noise being
  # read as a result. Clamped by val_balance_max_share, so a species whose boxes
  # cannot reach this floor without going val-heavy keeps the smaller target
  # rather than dragging extra drops out of train chasing an impossible one.
  # Costs train data for the smallest classes on purpose: a class you cannot
  # measure is a class you cannot trust.
  val_min_boxes_per_species: 20
  class_floor_min_images: 50    # a taxon (or pool, or hierarchy group) needs this many distinct post-cap TRAIN frames to be a class; below it the rollup walks up the taxonomy and ends at "fish"

  # FROZEN CLASS IDS. Index in this list IS the YOLO class id, permanently.
  # APPEND ONLY: never insert, never reorder, never delete a line.
  #
  # Before this existed, ids came from `sorted(all_species)`, so they were
  # alphabetical over whatever species happened to survive a given run. Adding
  # three species between the 2026-08-21 and 2026-08-22 runs moved every id
  # (snapper 10→12, blue cod 11→13, rock lobster 4→7) and put `Batoidea` at 0
  # purely because B sorts first. Two checkpoints a day apart could not be
  # compared, `compare_with_production` was evaluating a 17-output model against
  # a 20-class data.yaml, and mAP was silently rescaled because Ultralytics
  # averages only over classes that have val instances.
  #
  # Ordering is for human legibility, nothing downstream cares what the integer
  # is: `fish` takes the natural zero, the three reporting.indicator_species take
  # 1-3 so a leading `1` in a YOLO .txt means snapper, then the rest by data
  # volume as of 2026-08-22, and `bait` takes the last slot because it is not a
  # species and never appears in an abundance figure.
  #
  # A species present in the data but missing here is appended at the end with a
  # warning naming it: add it to this list to pin it. Entries with no data in a
  # given run KEEP their slot as an empty class, which is what makes the ids
  # stable across runs and costs nothing, since a zero-instance class is left out
  # of mAP entirely. Same for a species that floors into 'fish': it keeps its
  # slot and gets it back when the data grows.
  #
  # `fish` is required (the class floor needs somewhere to redirect to).
  class_order:
    - fish                      # 0  catch-all: an animal the model could not name
    - Chrysophrys auratus       # 1  snapper, indicator species. Renamed from
                                #    Pagrus auratus 2026-11-04 (same slot, same
                                #    animal); older checkpoints still carry the
                                #    old class name, the synonyms map folds it.
    - Parapercis colias         # 2  blue cod, indicator species
    - Jasus edwardsii           # 3  rock lobster, indicator species
    - Pseudolabrus miles        # 4
    - Notolabrus celidotus      # 5
    - Scorpis lineolata         # 6
    - Nemadactylus macropterus  # 7
    - Trachurus novaezelandiae  # 8
    - Triglidae                 # 9
    - Myxinidae                 # 10
    - Muraenidae                # 11
    - Elasmobranchii            # 12
    - Forsterygion lapillum     # 13
    - Helicolenus percoides     # 14
    - Cephaloscyllium isabella  # 15
    - Girella tricuspidata      # 16
    - Batoidea                  # 17
    - Conger verreauxi          # 18
    - Mustelus lenticulatus     # 19  rig: floored into 'fish' at 39 train images, slot held
    - Squalus acanthias         # 20  spiny dogfish: promoted out of Elasmobranchii 2026-08-22
    - bait                      # 21  not a species, last slot on purpose
    - Anguilliformes            # 22  eels: morays + congers pooled 2026-08-25.
                                #     Muraenidae (11) and Conger verreauxi (18)
                                #     keep their seats but are now always empty.
    - Meuschenia scabra         # 23  smooth leatherjacket: cleared the floor 2026-11-09, pinned so its id stops drifting

  # TRAINING CLASS ROLLUP (2026-11-10). Which class a labelled taxon trains as
  # is computed once per data prep by spyfish/ml/training/rollup.py from the
  # post-cap TRAIN frame counts and the taxonomy in `hierarchy_file`, and
  # written to species/rollup_map.json, which the run snapshot, the test
  # records and the planning scripts read. Nothing else decides a merge.
  #   1. `fish` and `bait` never move.
  #   2. Everything under a `rollup_pool_nodes` entry trains as that node
  #      (however many frames it has) unless listed in `rollup_keep_separate`.
  #      A pool under class_floor_min_images in total is not a class.
  #   3. A taxon with at least the floor stands alone.
  #   4. Below the floor: walk the ancestors nearest first. An ancestor that is
  #      already a class takes it; one that is not becomes a class only if the
  #      taxa it would collect that have NOT earned their own class reach the
  #      floor together (residual counting, so a rare species cannot borrow its
  #      common sibling's frames). Nothing reached: it trains as `fish`.
  # Experts keep labelling every species in BIIGLE; the rollup is training-time
  # only, so species detail survives in the MaxN CSVs and in reporting.
  hierarchy_file: "process_files/training/hierarchy.json"   # child -> parent (WoRMS genus + family, plus the pool nodes below at their own rank); rebuild with scripts/build_worms_hierarchy.py after a class-map reseed. Family is the coarsest automatic group; anything coarser must be a pool node.
  # Taxa that are ALWAYS trained as one class. Each is a real taxon, not a
  # shape-based grouping.
  #   Anguilliformes (2026-08-25): congers floor alone (64 frames) and morays
  #     were weak alone (recall 0.28-0.34, mAP 0.256 over three runs); "elongate
  #     body in a crevice" is the more learnable concept. Hagfish (Myxinidae)
  #     are class Myxini, not eels, and are not here on purpose.
  #   Elasmobranchii (2026-08-22): "a shark that is not one of the named ones".
  #     Rig arrives in groups (315 boxes in 55 frames) and floored at 39 train
  #     frames; school shark, sevengill and bronze whaler have a handful each.
  #   Batoidea: rays pool the same way (~70 frames together). Kept apart from
  #     Elasmobranchii because a disc and a torpedo are the two shapes a
  #     detector separates most reliably; rays sit under Elasmobranchii in the
  #     hierarchy, so a ray pool that fell under the floor would join the
  #     shark pool rather than `fish`.
  rollup_pool_nodes:
    - Anguilliformes
    - Elasmobranchii
    - Batoidea
  # Species under a pool node that get their own class instead. Add a species
  # here when it clears the floor by a margin and is worth naming; remove it
  # and it rejoins the pool at the next data prep. A keep-separate species that
  # cannot stand alone joins its pool after all (step 4), never `fish`.
  rollup_keep_separate:
    - Cephaloscyllium isabella   # carpet shark, ~230 frames, strong alone
    - Squalus acanthias          # spiny dogfish, promoted out of Elasmobranchii 2026-08-22 (141 frames / 17 drops)

  # SAME ANIMAL, TWO LABELS. Applied to every species name BEFORE the rollup
  # counts anything. The rollup is a rule over counts and cannot know that a
  # family label and a species label denote one fish in this data; these are
  # the cases where they do, so merging first keeps one animal's frames in one
  # pile (split across two labels, the smaller half floored into 'fish', which
  # is how hagfish and red gurnards ended up ground-truthed as 'fish', found
  # 2026-08-21). Policy: the bigger pile keeps its name. Delete a line when
  # the two labels start meaning different animals (a second gurnard species
  # turns up); the rollup then treats them as the distinct taxa they are.
  # One animal under two NAMES (`Pseudocaranx dentex` -> `georgianus`) is NOT
  # listed here: that is a synonym, and paths.species_synonyms rewrites it for
  # training and the annotations DB alike (canonicalize_species step 1).
  # NOTE: canonicalize_species is a SINGLE dict lookup, not transitive, so
  # every key must point at its final name directly (a value may not be a key).
  species_canonicalization:
    # Red gurnard is the ONLY gurnard in this data, so the family label and the
    # species label name the same animal. canonicalization_readiness.py reports
    # it READY (111 frames) but that script counts, it cannot know two labels
    # denote one animal.
    Chelidonichthys kumu: Triglidae         # 142 boxes / 111 frames vs family label's 316 / 60
    Eptatretus cirrhatus: Myxinidae         # 61 vs 139
    # Triplefins: common triplefin is the busy pile (111 boxes); the family
    # label (47) is in practice the same fish. Other Forsterygion species are
    # NOT mapped here any more: the hierarchy rolls them up (genus, then
    # family) or floors them, which is honest about what they are.
    Tripterygiidae: Forsterygion lapillum
    # Goatfish: blue-striped goatfish is the only goatfish seen (48 boxes vs
    # the family label's 1).
    Mullidae: Upeneichthys lineatus
    # A workflow label, not a taxon: "an animal worth a second look", so the
    # honest training class is the unidentified-animal bucket. Its BIIGLE
    # siblings ('Fish: final', 'Fish: review required', 'To review') resolve to
    # 'fish' through the class_map aliases, but this one was deleted from tree
    # 3511, so it has no alias to resolve through and needs naming here.
    # Found 2026-08-22 in KOK_20240219_BUV_KOK_013_01, 1 row.
    Interesting Sighting: fish
  # Species removed from TRAINING entirely (canonical names). Their boxes are
  # dropped at label conversion (not merged into 'fish' — a kina is not a
  # fish), so the animals appear unlabeled and the model learns to ignore
  # them. Annotations DB and BIIGLE are untouched; delete a line to bring a
  # species back at the next data prep.
  excluded_species:
    - Evechinus chloroticus   # kina: static benthic urchin, not a MaxN target; parked 2026-08-21, revisit for a dedicated kina/substrate task
  local_training_dir: "process_files/training"
  excluded_drops_file: "process_files/training_lists/excluded_drops.txt"   # drops removed entirely from training; one DropID per line, '#' comments OK
  test_drops_file: "process_files/training_lists/test_drops.txt"           # FROZEN test set: always test, never train/val; append-only, see scripts/propose_test_split.py
  # Curated BIIGLE volumes (extra_no_survey_id/volume_<id>) mix many source
  # deployments under one "drop". This CSV (drop, frame stem, source deployment)
  # lets cap_frames_per_drop treat each source deployment as its own drop, so
  # 328 frames of one 2021 video are capped like any pipeline drop. Volumes not
  # in the file keep the old behaviour (uncapped). Built by
  # scripts/build_extra_frame_deployments.py; a missing file means no volume is mapped.
  extra_frame_deployments_file: "process_files/training_lists/extra_frame_deployments.csv"
  # BIIGLE volume ids whose drops always go to TRAIN (old-label / legacy training
  # volumes whose annotations shouldn't be evaluated against). Resolved offline
  # via the volume_id column stamped into each drop's _biigle_training_raw.csv
  # at download time; CSVs downloaded before that column existed never match —
  # re-download the volume with --force to stamp them. This is the only manual
  # split control: val selection is fully automatic (auto_balance_val above).
  force_train_biigle_volumes: []
  retrain_min_improvement_pct: 2.0
  threshold_beta: 2.0           # F-beta the MaxN cutoff is picked at (spyfish/ml/training/threshold.py): recall counts this many times precision. A miss in the peak frame lowers MaxN with nothing downstream to recover it; a false box still has to survive the persistence filter and review, so recall is worth more. 1.0 = plain F1 (what Ultralytics' own P/R table assumes).
  # Per-drop frame filter (applied in assemble_yolo_dataset)
  cap_frames_per_drop: 50                # max frames per drop in the assembled YOLO dataset (extras bypass this cap). BUV is a fixed camera, so frames within a drop share one background + repeat individuals; beyond ~50 they're largely redundant (lowered 100→50, 2026-08-21). dominant_species frames are dropped first, so blue-cod-only frames go before multi-species ones.
  # Frames holding a species with fewer than this many frames CORPUS-WIDE are
  # exempt from cap_frames_per_drop. `dominant_species` already drops blue-cod-
  # only frames first, but once a drop has more than `cap` frames that contain
  # SOME non-dominant species, the sampler thins them at random — so a
  # deployment's only lobster frames compete on equal terms with its snapper
  # frames and can be thrown away. Exempting them keeps real, varied frames of
  # the scarce animal (different positions, different individuals) rather than
  # duplicating one frame, which only adds memorisation pressure.
  # Frame counts on the 2026-08-24 corpus: Parapercis 5432, Pseudolabrus 2287,
  # Pagrus 1876, Notolabrus celidotus 963, fish 722, Jasus 514, Nemadactylus
  # 282, Scorpis 273, Cephaloscyllium 247, Triglidae 214, Myxinidae 201,
  # Muraenidae 200, Squalus 176, Forsterygion 146, Batoidea 71, Conger 64.
  # 600 is set to just include rock lobster (514), a reporting-priority species
  # sitting at mAP 0.199. Raise it and blue cod eventually qualifies, which
  # would defeat the cap entirely. 0 disables the exemption.
  cap_exempt_rare_below_frames: 600
  dominant_species:                      # frames whose only labels are in this list are dropped first when over cap
    - "Parapercis colias"                # blue cod — overrepresented (~59% of all boxes); drop blue-cod-only frames first so the cap keeps frames with rarer species
    # - "Chrysophrys auratus"              # snapper — enable if it starts dominating too
  split_seed: 42                         # int = reproducible splits + frame selection; null = fresh randomness each run

  # ── Second-stage classifier TRAINING (spyfish/ml/classifier/, scripts/two_stage/) ──
  # BioCLIP 2 names the boxes YOLO finds (ml_inference.classifier runs it). These
  # keys drive building the crops, choosing the classifier's classes and the
  # fine-tune. The classifier's vocabulary is deliberately NOT the YOLO rollup's:
  # the detector pools eels because it cannot tell a moray from a conger, the
  # classifier exists to try. Crop margin, min box size and backbone are shared
  # with inference (ml_inference.classifier) so training crops match what the
  # pipeline cuts.
  classifier:
    source: biigle_csv            # where the boxes come from: biigle_csv (per-drop BIIGLE CSVs + frames), yolo_dataset (the assembled species/ dataset, already rolled up, what NeSI has), uoa. TWO_STAGE_SOURCE in the environment overrides this; the SLURM job sets yolo_dataset.
    # A species is a classifier class when it has at least this many crops over
    # at least this many drops; everything else trains and scores as other_class.
    # Drops matter because the fine-tune is held out by drop: a species from one
    # deployment can never be scored. Crops are the unit here (one crop is one
    # training example), where YOLO's floor counts frames. 2 / 30 is what the
    # 2026-11-04 checkpoint trained with; on the 2026-11 corpus 3 / 50 would
    # drop trumpeter, kahawai, stingray, blue maomao, demoiselle and goatfish
    # (656 of 54k boxes) into other_class. Kept at 30 to see how those fare.
    min_drops: 2
    min_crops: 30
    other_class: "other fish"     # a fish the classifier cannot name; ml_inference.classifier.label_map folds it to `fish` at inference
    not_fish_class: "not a fish"  # junk class, trained from the hard negatives (scripts/two_stage/hard_negatives.py). At inference a box named this stays in the raw CSV and is dropped by every downstream reader (spyfish/ml/raw_detections.py): no MaxN, frames, crops or BIIGLE box
    exclude_classes: [bait, fish] # labels that are not species: never a crop, never a class. training.excluded_species (kina) is applied as well, so a species parked for YOLO is parked here too (it trained the classifier until 2026-11-10)
    max_crops_per_drop_species: 300   # blue cod has 11.8k boxes in 8 drops; cap so one species does not swamp the probe. Ignored for the uoa source (every box counts there)
    seed: 42
    folds: 5                      # drop-grouped cross-validation folds for the probe and the fine-tune holdout
    iou_match: 0.5                # an expert box and a detector box are the same fish at this IoU or above
    prior_alpha: 1.0              # site prior strength in the probe evaluation (0 = off); the fine-tune report sweeps 0, 0.25, 0.5, 1
    probe:                        # the linear probe on frozen BioCLIP embeddings (spyfish/ml/classifier/classes.fit_probe): standardise, then class-balanced logistic regression
      max_iter: 3000
      c: 0.5                      # inverse regularisation strength
    finetune:                     # the recipe behind the 2026-11-04 checkpoint; scripts/two_stage/finetune_bioclip.py flags override per run
      fold: 3                     # which drop-grouped fold is held out when there is no frozen test split
      epochs: 6
      batch: 32
      unfreeze_blocks: 2          # trainable transformer blocks from the end of the image encoder (24 = all); ln_post and the projection always train
      lr_encoder: 1.0e-5
      lr_head: 1.0e-3
      weight_decay: 0.05
      label_smoothing: 0.1
      workers: 6                  # DataLoader worker processes that load and augment the crops; scripts/slurm/two_stage.sl asks for 8 CPUs (6 workers + the training process). 0 = on the training process, as before 2026-11-11. A run is reproducible for a given workers value (worker seeds come from seed above) but not bit-identical across values: the augmentation draws move from the main random stream to the workers'. --workers overrides per run
      augmentation:               # a top-down fish faces any way; colour and blur stand in for turbidity and depth
        rotation_degrees: 180     # +/- degrees, i.e. the full circle
        horizontal_flip: true
        color_jitter: [0.3, 0.3, 0.3, 0.05]   # brightness, contrast, saturation, hue
        blur_probability: 0.3
        blur_kernel: 5
        blur_sigma: [0.1, 1.5]
    hard_negatives:               # detector boxes no expert box explains, reviewed in clusters before they train as not_fish_class
      iou_negative: 0.3           # below this overlap with every expert box a detector box is a candidate
      max_per_drop: 400           # keep the candidate set the same order of size as the positives
      n_clusters: 16              # k-means groups for the contact-sheet review
    static_boxes:                 # scripts/two_stage/static_boxes.py: a box that stays in one place for minutes is not a fish (sea cucumber, sea star, stick, rock). 2026-11-12, after BioCLIP named HOR sticks `rock lobster` at 0.94
      link_distance_box: 0.5      # a box joins a track when its centre is within this share of the box diagonal of the track's MEAN centre, ...
      link_distance_px: 80        # ... or within this many pixels, whichever is larger: camera sway moves every object by the same pixels, so a small object needs the floor (overlap failed at ±15 px on an 80 px box). The mean, not the last box: sway rocks a fixed object around its mean, a fish swimming off leaves it
      link_size_ratio: 1.5        # and its diagonal is within this factor of the track's
      max_gap_seconds: 600        # a track survives this long without a detection. Long on purpose: YOLO sees a stick on 1% of frames (HOR_065: 62 of ~4,800 over 27 min), so continuity is not the signal
      min_span_seconds: 300       # a static track lasts at least 5 min. Tried 12 (2026-11-12): it removed a fifth of the junk AND a fifth of the fish across 72 reviewed tracks, because at SLI and ORA fish hold one spot for 13-30 min (tarakihi in the current, fish in reef holes). Duration only separates them where fish come and go (HOR)
      min_boxes: 20               # and has at least this many boxes
      max_spread_px: 25           # the signal: box centres within this median distance of their median (sway included). A fish coming back to the bait never lands on the same pixels twice
      max_size_spread: 0.15       # and box diagonals within this share of their median (a different fish at the same spot has a different size)
      crops_per_track: 5          # negatives taken per track, spread over its span: hundreds of near-identical crops of one stick teach nothing new
      crop_min_iou: 0.7           # crops come only from boxes overlapping the track's median box this much: the static object, not a fish lying across the spot
      # Pipeline (spyfish/ml/static_boxes.py, run in --ml-post). A static track whose
      # fish score (YOLO mean confidence + how rarely YOLO fires on it, i.e.
      # -log(boxes per minute), each standardised by the means/stds below, from the
      # first review's 136 tracks) is under flag_below gets its boxes relabelled
      # `label`: out of the ML MaxN and frame choice, uploaded to BIIGLE for the
      # expert. Review of 240 tracks / 14 surveys (2026-11-12): below 0 = 111 junk, 0 fish.
      not_a_fish_flag: true
      label: "Not a fish?"        # BIIGLE label 789444 (workflow tree 3375); see biigle.label_mapping and maxn_exclude_classes
      flag_below: 0.0
      score_conf_mean: 0.4272
      score_conf_std: 0.1119
      score_rate_mean: -2.0704
      score_rate_std: 1.5555
  background_ratio: 0.1                  # target share of background (empty-label) frames in the TRAIN split; 0 disables. Ultralytics rec 0–10%, COCO ≈ 1%. Backgrounds (mostly from training-frame volumes) are pooled across train drops and subsampled to hit this ratio.


site_prior:
  # Species-presence prior per marine reserve (the 3-letter DropID prefix) for the
  # planned two-stage classifier (two_stage_classifier_plan.md §6). Inputs are
  # EXPERT annotations only (legacy + BIIGLE rows, annotated_by = 'expert'); no
  # citsci, no ML. A species' raw rate at a reserve is the share of expert-reviewed
  # drops in which it was recorded (presence, not counts).
  #
  # Reserves with few reviewed drops have not seen all their species (rarefaction
  # output shows how many a sample of n drops finds), so every reserve borrows from
  # its neighbours: prior = (n * own_rate + pseudo_drops * neighbour_rate) / (n + pseudo_drops).
  # Neighbours are weighted by distance between reserve centroids (median deployment
  # position) with an exponential kernel exp(-d / length_scale_km).
  length_scale_km: 250      # a reserve 250 km away counts e^-1 of one next door; NZ's north-south gradient (PKI subtropicals vs BNP temperates) is ~1,500 km
  pseudo_drops: 20          # a reserve with 20 expert-reviewed drops is half its own data, half neighbours; OKA (1 drop) is nearly all neighbours, BNP (349) nearly all its own
  donor_min_drops: 10       # reserves with fewer reviewed drops only borrow, they lend nothing (their rates are noise)
  floor: 0.01               # minimum presence probability for any species at any reserve: vagrants and range shifts stay possible, and nothing is ever impossible for the classifier
  rarefaction_sample_sizes: [5, 10, 17, 30, 50, 100]   # expected species found in n drops, per reserve: the "how incomplete is a small reserve's list" diagnostic
  bucket_names: ["fish"]    # not species: excluded from the prior but their drops still count as reviewed


training_extraction:
  # Standalone tool: pulls N frames per drop directly from S3 (cv2 + presigned URL),
  # runs the configured model, uploads to a survey-level Biigle volume.
  # See `python -m spyfish.ml.training.extract_training_frames --help`.
  n_frames: 10                # frames per drop; back-loaded toward sampling_end (more fish later)


validation_patterns:
  # The date segment is YYYYMMDD constrained to a real calendar date in 19xx/20xx,
  # not a bare \d{8}. 19xx is admitted because the earliest real BUV survey is
  # Poor Knights 1998; the century is still pinned to 19/20 so a DDMMYYYY entered
  # by hand (e.g. 23042026, which would parse as year 2304 and stretch every year
  # axis in the dashboard) is still rejected — the day never starts with 19 or 20
  # in a way that also leaves a valid month and day behind it.
  drop_id:   "^[A-Z]{3}_(?:19|20)\\d{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12]\\d|3[01])_BUV_[A-Z]{3}_\\d{3}_\\d{2}$"
  survey_id: "^[A-Z]{3}_(?:19|20)\\d{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12]\\d|3[01])_BUV$"
  site_id:   "^[A-Z]{3}_\\d{3}$"
  # Model names: {type}_{YYYYMMDD}[_{HHMMSS}], type first, training stamp
  # LAST, nothing after it (species_20260822_192536, cfd_binary_water_20260301).
  # The file stem of the promoted weights IS the model name in the annotations
  # database (external_id), and "newest model wins" sorts on the stamp, so a
  # name that breaks the rule is refused before the pipeline runs (decision
  # 2026-10-15). Stamp-first names from older promotions are rewritten to this
  # form by `AnnotationDatabaseManager.init_db`.
  model_name: "^[a-z][a-z0-9_]*?_(20\\d{6})(?:_(\\d{6}))?$"

validation_rules:
  deployments:
    file_name: "spyfish_metadata/sharepoint_lists/BUV Deployment.csv"
    required: ["DropID", "SurveyID", "SiteID","SamplingStart", "SamplingEnd"]
    unique: ["DropID"]
    formats: ["DropID"]
    info_columns: ["SurveyID", "SiteID"]
    foreign_keys:
      surveys: "SurveyID"
      sites: "SiteID"
    # The three-letter prefix of a DropID is a reserve acronym, and
    # `Marine Reserves.csv` is the authoritative list of them. Checked against
    # that list rather than against the SiteID prefix embedded further along:
    # comparing the two gives 24 false positives, because a survey legitimately
    # visits another reserve's sites (CRP_20220407_BUV_TAW_049_01 is a Cape
    # Rodney survey at Tawharanui). "Is this a known acronym" is the question
    # that has an answer.
    multi_foreign_keys:
      - column: "DropID"
        target: "reserves"
        target_column: "SurveyLocationAcronym"
        extract: "^([A-Za-z]{3})_"
    relationships:
      - column: "DropID"
        rule: "equals"
        template: "{SurveyID}_{SiteID}_{ReplicateWithinSite:02}"
      - column: "FileName"
        rule: "equals"
        template: "{DropID}.mp4"
        allowed_values: ["NO VIDEO BAD DEPLOYMENT"]
        allow_null: true
      - column: "LinkToVideoFile"
        rule: "equals"
        template: "media/{SurveyID}/{DropID}/{DropID}.mp4"
        allowed_values: ["NO VIDEO BAD DEPLOYMENT"]
        allow_null: true
    values:
      - column: "Latitude"
        rule: "value_range"
        range: [-48, -36]
        allowed_values: [0]
      - column: "Longitude"
        rule: "value_range"
        range: [170, 178.5]
        allowed_values: [0]
  surveys:
    file_name: "spyfish_metadata/sharepoint_lists/BUV Survey Metadata.csv"
    required: ["SurveyID"]
    unique: ["SurveyID"]
    info_columns: ["SurveyName"]
    formats: ["SurveyID"]
    foreign_keys: {}
    relationships: []
  sites:
    file_name: "spyfish_metadata/sharepoint_lists/BUV Survey Sites.csv"
    # ProtectionStatus is required, not just format-checked. A site without one
    # is not an error anywhere downstream — `protection_group` reads it as
    # unclassified and the theme renders it neutral grey — so the omission
    # travels all the way to a chart before anyone sees it, and by then it looks
    # like a styling question rather than a missing cell in SharePoint. All
    # 2,543 sites carry one today; this keeps it that way.
    required: ["SiteID", "LinkToMarineReserve", "ProtectionStatus"]
    unique: ["SiteID"]
    info_columns: ["SiteName", "LinkToMarineReserve"]
    formats: ["SiteID"]
    foreign_keys: {}
    # A site between two areas carries both names in one comma-joined cell, so
    # this cannot be a plain foreign key. Unchecked, a typo becomes a new
    # marine reserve: the reporting groups every deployment by these names, so
    # a misspelling silently gets its own row in every per-area chart and its
    # deployments disappear from the real one.
    multi_foreign_keys:
      - column: "LinkToMarineReserve"
        target: "reserves"
        target_column: "Title"
        separator: ","
    relationships: []
    values:
      # A new spelling here is invisible without this: the reporting matches
      # ProtectionStatus against named lists, so anything unrecognised drops
      # into "Other" and leaves the reserve comparison without a word.
      - column: "ProtectionStatus"
        rule: "one_of"
        # The same list the pipeline normalises to, by reference rather than by
        # copy — see `known_protection_statuses` at the top of this file.
        allowed: *known_protection_statuses
  species:
    file_name: "spyfish_metadata/sharepoint_lists/BUV Species.csv"
    required: ["AphiaID", "CommonName", "ScientificName"]
    unique: ["AphiaID", "ScientificName", "CommonName"]
    info_columns: ["AphiaID", "CommonName", "ScientificName"]
    foreign_keys: {}
    relationships: []
  reserves:
    # The authoritative list of areas: `Title` is the name sites link to, and
    # `SurveyLocationAcronym` is the three-letter DropID prefix. Both were
    # downloaded and ignored until 2026-08-18 — every rule here was empty, so
    # nothing checked that a reserve named anywhere else actually exists.
    file_name: "spyfish_metadata/sharepoint_lists/Marine Reserves.csv"
    required: ["Title", "SurveyLocationAcronym"]
    unique: ["Title", "SurveyLocationAcronym"]
    info_columns: ["Title", "SurveyLocationAcronym"]
    foreign_keys: {}
    relationships: []
