  pipeline_status_column: "PipelineStatus"
  survey_id_column: "SurveyID"
  site_id_column: "SiteID"
  replicate_column: "ReplicateWithinSite"
  file_name_column: "FileName"
  link_to_marine_reserve_column: "LinkToMarineReserve"
  protection_status_column: "ProtectionStatus"
  site_name_column: "SiteName"
  selection_reason_column: "SelectionReason"
  is_bad_deployment_column: "IsBadDeployment"
  video_file_link_column: "LinkToVideoFile"
  sampling_start_column: "SamplingStart"
  sampling_end_column: "SamplingEnd"
  # Selection CSV columns
  # All time columns are absolute seconds from frame 0 of the source video file.
  clip_start_absolute_column: "ClipStartAbsoluteSeconds"
  clip_end_absolute_column: "ClipEndAbsoluteSeconds"
  clip_max_time_column: "TimeOfMaxAbsoluteSeconds"
  maxn_time_seconds_column: "TimeOfMaxAbsoluteSeconds"
  confidence_agreement_column: "ConfidenceAgreement"
  confusion_score_column: "ConfusionScore"
  scientific_name_column: "ScientificName"
  maxn_time_column: "TimeOfMax"
  max_interval_column: "MaxInterval"
  annotated_by_column: "AnnotatedBy"
  interval_annotation_column: "IntervalAnnotation"
  time_seconds_column: "TimeAbsoluteSeconds"
  subject_id_column: "SubjectID"  # Zooniverse subject_id — written into citsci MaxN CSVs and the annotations DB external_id for provenance

# Centralized path and storage configuration
paths:
  # Base directory for all project data
  base_dir: "process_files"
  deployment_targets_csv: process_files/deployment_targets.csv
  test_deployment_csv: tests/fixtures/test_deployment_metadata.csv
  # Legacy directories (at project root, synced to S3)
  legacy:
    zooniverse: "process_files/zooniverse/legacy_classifications"
  movie_extensions: ["avi", "mov", "mp4", "mpg", "wmv"]
  missing_files_filename: "missing_files_in_aws.txt"
  extra_files_filename: "extra_files_in_aws.txt"
  # Metadata paths (relative to bucket root)
  metadata:
    root: "metadata"
    sharepoint_dir: "sharepoint_lists"
    status_dir: "status"
    files:
      deployment_csv: "BUV Deployment.csv"
      survey_csv: "BUV Survey Metadata.csv"
      site_csv: "BUV Survey Sites.csv"
      species_csv: "BUV Species.csv"
      reserves_csv: "Marine Reserves.csv"
      legacy_experts_csv: "BUV Annotations Legacy Experts.csv"

  # Optional: absolute path to an alternate base dir for media downloads (e.g. /tmp/spyfish).
  # Use this for a temp/no-backup location when videos are large or ephemeral.
  # If unset, media resolves to <project_root>/media as before.
  media_base_dir: /nesi/nobackup/wildlife03546

  # Sub-directories (local and S3 suffixes)
  sub_dirs:
    media: "media"
    annotations: "annotations"
    deployment_data: "deployment_data"
    db: "db"
    logs: "logs"
    training: "training"
    models: "models"
    base_model: "base_model"
    pipeline_model: "pipeline_model"
    archived_models: "archived_models"


ml_inference:
  limit_processing: 5 # SAFEGUARD: Only process N videos per run while building
  log_interval_frames: 10 # Log every N frames during ML inference
  ml_fps: 3        # Target frames per second for ML inference. Stride is computed at runtime from the video's actual FPS.
  imgsz: 640  #1920
  confidence_threshold: 0.25      # Base YOLO inference threshold; gates raw detections → BIIGLE frame selection. Lowered 0.25→0.15 (2026-05-26) to surface more boxes for expert review (recall-leaning).
  maxn_confidence_threshold: 0.40  # Gates the MaxN CSV → Zooniverse/citsci clip selection AND the reported ML abundance count. Lowered 0.50→0.40 (2026-05-26) to surface more clips for volunteer review.
  max_boxes_per_frame: 80          # Ceiling: if a drop's inference averages more detections/frame than this, treat it as erroneous (model saturating max_det on out-of-distribution footage, or confidence_threshold mis-set to ~0) and fail the drop instead of building a giant COCO. No real BUV frame has 80 fish; the flood case hits YOLO's max_det=300.
  batch_size: 32                   # Frames per YOLO predict() call during video inference. Batching amortises per-call overhead and keeps the GPU fed (single-frame calls leave an A100 at ~0% util). 32 fits comfortably at imgsz=640 on a 40GB A100; lower to 8–16 for larger imgsz or smaller GPUs.
  # YOLO NMS, applied at inference (passed to model.predict). Cleans overlapping/stacked
  # boxes at the source, so the raw CSV — and therefore MaxN counts, frame selection AND
  # the BIIGLE COCO — are all consistent. Tuning these requires re-running --ml (fast now
  # that inference is batched).
  nms_iou: 0.45                    # Boxes overlapping more than this IoU are suppressed. Lower = more aggressive merging of duplicate boxes on one fish (YOLO default 0.7). Tuned to 0.45 by eyeballing real frames across SLI_117_02 (2026-06-04): 0.4 cleaned duplicates dramatically but deleted one real fish; 0.45 keeps the dedup win while preserving that fish. Raise toward 0.5 if distinct overlapping fish (schooling/eels) get merged.
  nms_agnostic: true               # Cross-class NMS: when true, an overlapping species box + generic 'fish' box on the same animal collapse to one (highest confidence wins) instead of both surviving. YOLO default is false (per-class).
  remote_host: "mahuika"
  remote_user: "kalindi"
  extraction:
    interval_seconds: 10
    annotated_by_prefix: "ml"

extraction:
  clip_length: 10.0        # Length of each extracted clip in seconds
  clip_cap: 180            # Maximum number of clips to extract per video
  video_start_threshold_seconds: 120 # Seconds from video start used for start-of-video health check clips
  force_binary_strategy: false       # If true, use binary strategy regardless of species count
  sample_all_clips: false            # If true, bypass ML strategy and select every non-overlapping clip in the sampling window (subject to clip_cap)
  binary_strategy:
    maxn_export: 30          # Clips at highest fish-count moments
    confusing_export: 60     # Clips with high count but low confidence (uncertain detections)
    empty_export: 10         # Clips with zero detections (false negative check)
    start_export: 3          # Clips from the start of the video (health check)
    temporal_spacing_seconds: 10  # Minimum seconds between selected clips
  multiclass_strategy:
    per_species_maxn_export: 4       # MaxN clips per species
    per_species_confusing_export: 3 # Confusing clips per species
    per_video_empty_export: 3        # Empty clips per video
    per_video_start_export: 2        # Start clips per video
    temporal_spacing_seconds: 10     # Minimum seconds between selected clips
  ml_peak_augmentation:              # Adds frame-level ML peaks to citsci-driven BIIGLE selection (sub-second precision; catches moments volunteers missed)
    top_k_per_species: 2             # Extra frames added per species from the ML raw CSV (top-count peaks)
    min_confidence: 0.25             # Count detections at or above this conf — lower than maxn_conf=0.5 on purpose, surfaces transient multi-fish moments
    citsci_dedupe_tolerance_seconds: 1.0 # Drop ML-peak rows within this many seconds of any citsci-selected frame (avoids near-duplicates)

zooniverse:
  project_id: 30327          # Upload target — single project only
  source_project_ids:        # All projects to fetch classifications FROM
    - 14054                  # spyfish-aotearoa main
    - 30327                  # spyfish-aotearoa-ey (EY clone workflow)
  size_limit_mb: 12.0  # Zooniverse upload limit — CRF is calibrated to stay under this
  min_clips_per_video: 30  # Minimum clips per video — if ML strategy selects fewer, top up with evenly-spaced health checks
  min_agreement_pct: 50.0 # Aggregator filter: drop (subject, species) rows where vote_count / total_classifiers < this. Handles the full retirement-1 (expert) → retirement-30 (broad public) range without per-workflow tuning.
  consensus_something_here_pct: 50.0 # Consensus-fish rule: when no single species clears min_agreement_pct but at least this % of voters saw SOMETHING (votes - nothing_here_votes), emit one row with species="fish".
  max_frames_per_run: 3  # Max frames extracted per run of identical MaxN count

deployment_validation:
  buv_video_duration_seconds: 1800  # Expected minimum duration of a full BUV deployment (30 min)
  sampling_end_buffer_seconds: 0  # Sampling can end up to 2 min before the full duration — still valid

orchestrator:
  log_output: "console"

ffmpeg:
  crf: 22
  preset: "fast" # TODO is this ok
  codec: "libx264"


biigle:
  # Named projects. Workflow: pipeline uploads to `in_progress`; annotator moves
  # the volume to `done` when finished, which is where --biigle-sync reads from.
  # `playground` is the testing sandbox — point uploads there by setting
  # BIIGLE_PROJECT_ID=4081 in the environment.
  projects:
    in_progress: 4942        # upload target — pipeline pushes new volumes here
    done: 3711               # Spyfish Aotearoa — annotator-finished volumes
    playground: 4081         # sandbox for testing / try-things-out
    training: 4626           # legacy backup-of-record for training-data uploads
  # Default project for generic handler methods (used when no role is specified).
  # Points at in_progress so plain `config.biigle_project_id` = upload target.
  project_id: 4942
  disk_id: 134          #  134 doc, 98 test, S3 bucket disk reference
  annotation_report_type_video: 8          # Video annotation CSV report
  annotation_report_type_images: 3         # Image annotation CSV report
  volume_report_type_video: 10                   # TODO Volume overview report
  volume_report_type_image: 10                   # TODO Volume overview report
  # Done labels — whole-file labels that signal a volume is ready for ingestion.
  # All listed labels must be present. Gated on "Done Volume" only for now;
  # re-add "Done QA Review" once the QA pass is part of the workflow (see todo).
  done_labels: ["Done Volume"]
  # When true, --biigle-sync requires the Done-label gate (volume_is_done) before
  # ingesting a volume's annotations. When false, the volume's presence in the
  # `done` project (3711) is treated as sufficient and every volume awaiting sync
  # is ingested. Flipped to false 2026-05-28 — project moves are the workflow;
  # see todo to retire the label gate entirely.
  require_done_label: false
  # Default fish label for ML annotations uploaded to Biigle
  # This is the exact fallback if a species is not found in label_mapping below.
  default_fish_label_id: 531298   # tree 3375 → "Fish: review required" — fallback for fish-bucket / unknown ML predictions
  default_bait_label_id: 537309   # tree 3375 → "Bait" — used when an ML annotation's class resolves to 'bait'
  default_label_tree_id: 3511 # 3375

  # Label tree that holds the CMECS substrate / cover labels ("Spyfish CMECS
  # Substrate"). Any annotation whose label belongs to this tree is measured for
  # percent-cover, regardless of shape (magic-wand Polygon or traced LineString).
  # Tree membership — not a label-name prefix — is the discriminator: CMECS
  # hierarchy paths start at generic roots ("Biotic Component", "Substrate
  # Component", ...) with no Spyfish marker, so only the tree ID identifies them
  # reliably. This is also what separates a substrate LineString from a fish-SIZE
  # LineString: size lines carry a species label (tree 3511) or "Scale bar", so
  # they route to process_sizes() instead.
  substrate_label_tree_id: 3994

  # OVERRIDE map only: species scientific/common name (from COCO JSON) → Biigle label ID.
  # This is the FIRST routing source in upload_frames.py and exists to force a model
  # class to a DIFFERENT label than its natural one — e.g. send an uncertain species to
  # "Fish: review required" for expert confirmation. It is NOT the species list.
  # Normal routing is handled downstream without any entry here:
  #   1. label_mapping (this dict)          ← overrides only
  #   2. species_labels.csv (~175 species)  ← full BIIGLE label tree, keyed by scientific name
  #   3. 'bait'  → default_bait_label_id
  #   4. 'fish' / unknown → default_fish_label_id
  # Most of the 16-class model (13 species + bait + fish) resolves via sources 2–4
  # with no entry here. The one exception below is a deliberate override.
  label_mapping:
    # Family-level "Gurnards - Triglidae" (was 477460) was deleted from BIIGLE tree 3511,
    # so the model's `Triglidae` class has no natural label in species_labels.csv. Route it
    # to the red-gurnard SPECIES label (Chelidonichthys kumu, 477395) — decision 2026-06-03.
    # NOTE: this merges family-level detections into the species label, so in BIIGLE a
    # `Triglidae` call is indistinguishable from a `Chelidonichthys kumu` call. Remove this
    # entry if the "Gurnards - Triglidae" family label is restored in the tree.
    'Triglidae': 477395
  # HTTP timeout for all Biigle API requests (seconds). Prevents indefinite hangs
  # on slow or unreachable endpoints.
  request_timeout_secs: 30
  # Polling config for async Biigle operations
  volume_finalize_max_retries: 10
  volume_finalize_retry_interval_secs: 3.0
  report_download_max_retries: 60
  report_download_retry_interval_secs: 2.0

training:
  image_extensions: [".jpg", ".jpeg", ".png", ".bmp", ".tiff", ".tif", ".webp"]   # canonical image suffixes accepted anywhere in the pipeline
  epochs: 100
  patience: 25
  imgsz: 640
  batch: 16                     # 16 fits ~16GB GPUs at imgsz=640; drop to 4 if imgsz=1280, raise to 32 on 24GB+ cards
  optimizer: "AdamW"           # AdamW outperformed SGD on the 2026-04 species sweep; flip back to "SGD" if needed
  lr0: 0.001                   # initial learning rate; scale up to ~0.01 if optimizer is SGD
  dropout: 0.1                 # head-dropout rate; helps small-dataset overfitting (set 0.0 to disable)
  train_pct: 1.0
  val_pct: 0.0                  # 0 = no per-survey val donation (used only when auto_balance_val is false). With auto_balance_val on, val comes from the species-balanced selector instead.
  test_pct: 0.0                 # 0 = skip test split entirely; test drops roll into train
  # Species-balanced val selection (the suggester, folded into the pipeline).
  # When true, the split picks whole drops into val so each multi-source species
  # reaches ~val_balance_pct of its boxes (greedy, stops within tolerance), honouring
  # force_val_drops (seeded) / force_train_drops (excluded). Replaces per-survey donation.
  auto_balance_val: true
  val_balance_pct: 0.08         # target val fraction per multi-source species
  val_balance_tolerance: 0.2    # stop when the worst-covered species is within this of target (lower = more drops, tighter coverage)
  class_floor_min_images: 50    # merge species appearing in fewer than this many distinct frames into "fish"
  local_training_dir: "process_files/training"
  excluded_drops_file: "process_files/training_lists/excluded_drops.txt"   # drops removed entirely from training; one DropID per line, '#' comments OK
  force_val_drops_file: "process_files/training_lists/force_val_drops.txt" # drops to force into val (overrides survey-aware donation)
  force_train_drops_file: "process_files/training_lists/force_train_drops.txt" # drops to force into train (overrides survey-aware donation; force_val wins on overlap)
  retrain_min_improvement_pct: 2.0
  # Per-drop frame filter (applied in assemble_yolo_dataset)
  cap_frames_per_drop: 100               # max frames per drop in the assembled YOLO dataset (extras bypass this cap). BUV is a fixed camera, so frames within a drop share one background + repeat individuals — beyond ~100 they're largely redundant. dominant_species frames are dropped first, so blue-cod-only frames go before multi-species ones.
  dominant_species:                      # frames whose only labels are in this list are dropped first when over cap
    - "Parapercis colias"                # blue cod — overrepresented (~59% of all boxes); drop blue-cod-only frames first so the cap keeps frames with rarer species
    # - "Pagrus auratus"                   # snapper — enable if it starts dominating too
  split_seed: 42                         # int = reproducible splits + frame selection; null = fresh randomness each run
  background_ratio: 0.1                  # target share of background (empty-label) frames in the TRAIN split; 0 disables. Ultralytics rec 0–10%, COCO ≈ 1%. Backgrounds (mostly from training-frame volumes) are pooled across train drops and subsampled to hit this ratio.


training_extraction:
  # Standalone tool: pulls N frames per drop directly from S3 (cv2 + presigned URL),
  # runs the configured model, uploads to a survey-level Biigle volume.
  # See `python -m spyfish.ml.training.extract_training_frames --help`.
  n_frames: 10                # frames per drop; back-loaded toward sampling_end (more fish later)
  annotation_type: species     # "binary" or "species" — picks `{kind}_*.pt` from pipeline_model/


validation_patterns:
  drop_id:   "^[A-Z]{3}_\\d{8}_BUV_[A-Z]{3}_\\d{3}_\\d{2}$"
  survey_id: "^[A-Z]{3}_\\d{8}_BUV$"
  site_id:   "^[A-Z]{3}_\\d{3}$"

validation_rules:
  deployments:
    file_name: "metadata/sharepoint_lists/BUV Deployment.csv"
    required: ["DropID", "SurveyID", "SiteID","SamplingStart", "SamplingEnd"]
    unique: ["DropID"]
    formats: ["DropID"]
    info_columns: ["SurveyID", "SiteID"]
    foreign_keys:
      surveys: "SurveyID"
      sites: "SiteID"
    relationships:
      - column: "DropID"
        rule: "equals"
        template: "{SurveyID}_{SiteID}_{ReplicateWithinSite:02}"
      - column: "FileName"
        rule: "equals"
        template: "{DropID}.mp4"
        allowed_values: ["NO VIDEO BAD DEPLOYMENT"]
        allow_null: true
      - column: "LinkToVideoFile"
        rule: "equals"
        template: "media/{SurveyID}/{DropID}/{DropID}.mp4"
        allowed_values: ["NO VIDEO BAD DEPLOYMENT"]
        allow_null: true
    values:
      - column: "Latitude"
        rule: "value_range"
        range: [-48, -36]
        allowed_values: [0]
      - column: "Longitude"
        rule: "value_range"
        range: [170, 178.5]
        allowed_values: [0]
  surveys:
    file_name: "metadata/sharepoint_lists/BUV Survey Metadata.csv"
    required: ["SurveyID"]
    unique: ["SurveyID"]
    info_columns: ["SurveyName"]
    formats: ["SurveyID"]
    foreign_keys: {}
    relationships: []
  sites:
    file_name: "metadata/sharepoint_lists/BUV Survey Sites.csv"
    required: ["SiteID", "LinkToMarineReserve"]
    unique: ["SiteID"]
    info_columns: ["SiteName", "LinkToMarineReserve"]
    formats: ["SiteID"]
    foreign_keys: {}
    relationships: []
  species:
    file_name: "metadata/sharepoint_lists/BUV Species.csv"
    required: ["AphiaID", "CommonName", "ScientificName"]
    unique: ["AphiaID", "ScientificName", "CommonName"]
    info_columns: ["AphiaID", "CommonName", "ScientificName"]
    foreign_keys: {}
    relationships: []
  reserves:
    file_name: "metadata/sharepoint_lists/Marine Reserves.csv"
    required: []
    unique: []
    info_columns: []
    foreign_keys: {}
    relationships: []
